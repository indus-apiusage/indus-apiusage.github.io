<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55CFFF"/>
      <stop offset="0.58" stop-color="#6A8CFF"/>
      <stop offset="1" stop-color="#F08DBB"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5D78B2" flood-opacity="0.24"/>
    </filter>
  </defs>

  <!-- Quiet white base keeps the icon legible in both Finder and the Dock. -->
  <rect x="36" y="36" width="952" height="952" rx="220" fill="#FBFCFF"/>
  <rect x="37" y="37" width="950" height="950" rx="219" fill="none" stroke="#DCE5F2" stroke-width="5"/>

  <!-- Small central signal mark. -->
  <g transform="translate(512 512) scale(2) translate(-512 -512)" filter="url(#softShadow)">
    <rect x="382" y="382" width="260" height="260" rx="76" fill="url(#mark)"/>
    <rect x="395" y="395" width="234" height="234" rx="63" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="3"/>
    <path d="M512 445V577M512 445L562 495M512 515L562 565" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="445" r="16" fill="#FFFFFF"/>
    <circle cx="562" cy="495" r="16" fill="#DDF8FF"/>
    <circle cx="562" cy="565" r="16" fill="#FFD8E8"/>
  </g>
</svg>
